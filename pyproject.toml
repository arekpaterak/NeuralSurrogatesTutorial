[project]
name = "neural-surrogates-tutorial"
version = "0.1.0"
requires-python = ">=3.10,<3.13"
dependencies = [
    "torch>=2.12,<2.13",
    "torch-geometric==2.6.1",
    "numpy",
    "scipy",
    "matplotlib",
    "pyvista",
    "tqdm",
    "ipython",
    "ipykernel",
    "jupyter",
]

[tool.uv.sources]
torch = { index = "pytorch-cu132" }

[[tool.uv.index]]
name = "pytorch-cu132"
url = "https://download.pytorch.org/whl/cu132"
explicit = true
